  if(c.mode==='sleep'&&dPers<2&&hp.moving&&Math.random()<.02){c.mode='idle';c.timer=.5}

  if(petting){const tx=hp.x+Math.sin(hp.yaw)*.9,tz=hp.z+Math.cos(hp.yaw)*.9;const d=Math.hypot(tx-c.x,tz-c.z);if(d>.15){const st=Math.min(d,sp.sp*dt);c.x+=(tx-c.x)/d*st;c.z+=(tz-c.z)/d*st;c.yaw+=wrapA(Math.atan2(hp.x-c.x,hp.z-c.z)-c.yaw)*Math.min(1,dt*8);moving=true}else c.yaw+=wrapA(Math.atan2(hp.x-c.x,hp.z-c.z)-c.yaw)*Math.min(1,dt*5)}

  if(R.tail){if(R.type==='dog'||R.type==='cat')R.tail.rotation.y=Math.sin(t*(c.mode==='sit'&&dPers<3?9:2.4)+ph)*(R.type==='dog'?.5:.25)*(1+(petting?1:0));else if(R.type==='bunny')R.tail.scale.setScalar(1+Math.sin(t*3)*.04)}
  R.ears.forEach((e,i)=>{if(R.type==='bunny'){e.rotation.z=(i?-1:1)*(.05+Math.sin(t*.8+i)*.04)+Math.max(0,Math.sin(t*.37+i*2))*.06*0}else if(R.type==='dog'){e.rotation.z=(i?-1:1)*(.35+w*.18)}});
  c.blinkT-=dt;if(c.blinkT<=0){c.blink=.12;c.blinkT=2+Math.random()*4}if(c.blink>0)c.blink-=dt;
  const be=(c.blink>0||c.sleepA>.5)?.12:1;R.eyes.forEach(e=>e.scale.y=1.2*be);

  if(c.mode==='sleep'&&Math.random()<.004)emoteWorld(c.x,1.5,c.z,'💤');
 })}

 if(PET.mode==='sleep'||PET.mode==='climb')return'sleep';
 if(ev&&nowS()<ev.until)return ev.e;
 const n=S.needs,tc=S.tc;
 if(ENV.dark&&!hasLamp()&&nowS()>S.comfortUntil)return'fear';
 if(angerNow()>40)return negEmo();
 if(n.food<18)return'hungry';
 if(tc.c>.45)return'cold';if(tc.h>.45)return'hot';
 if(n.energy<25)return'sleepy';
 if(n.social<22)return'lonely';
 if(n.mood<28)return'sad';
 if(n.fun<22)return'bored';
 if(PET.mode==='play'&&PET.play){const l=playLikeOf(PET.play.k);return l>0?'excited':l<0?'neutral':'happy'}
 if(PET.mode==='petting'&&PET.petId){const p=petById(PET.petId);return p&&S.P.pk===p.type?'love':'happy'}
 if(S.bond>=60&&n.mood>=65&&nowS()-lastInt<45)return'love';
 if(n.mood>=72)return'happy';
 return'neutral'}
function emoTick(){const e=computeEmo();if(e!==PET.emo){const old=PET.emo;setEmo(e);nextEmit=nowS()+.2;
  if(e==='fear'&&old!=='fear'&&!ev&&ENV.dark){say(emoLine('fear','dark'))}
  if(e==='lonely'&&old!=='lonely')say(emoLine('lonely'));
  if(e==='cold'&&old!=='cold'){S.log.coldN=(S.log.coldN||0)+1;say(emoLine('cold'));if(S.pets.length&&Math.random()<.5)PET.extra=null}
  if(e==='hot'&&old!=='hot')say(emoLine('hot'));}
 const nw=nowS();if(nw>nextEmit&&EMIT[e]){nextEmit=nw+(e==='sleep'?2.2:1.9);if(Math.random()<.8||e==='sleep'||e==='angry'||e==='love')emote(pick(EMIT[e]));if(e==='sleepy'&&Math.random()<.2)emote('🥱')}}
/* ===== thermal ===== */
function thermo(dt,c,sim){const lo=COMF()[0],hi=COMF()[1];
 const x=sim?0:PET.x,z=sim?0:PET.z;let felt=sim?feltTemp(c,0,.5):feltTemp(c,x,z);
 S.felt=felt;const cT=clamp((lo-felt)/8,0,1),hT=clamp((felt-hi)/5,0,1);const k=sim?1:Math.min(1,dt*.3);S.tc.c+=(cT-S.tc.c)*k;S.tc.h+=(hT-S.tc.h)*k;
 S.fmod*=Math.exp(-dt/(sim?5:70));
 const L=S.log;L.cold+=S.tc.c*dt;L.hot+=S.tc.h*dt;L.tout=(L.tout||0)+tempOutC(c)*dt;L.tin=(L.tin||0)+indoorTemp(tempOutC(c))*dt;
 if(!sim){if(wasCold>.4&&S.tc.c<.2&&S.tc.h<.2&&!S.sleeping&&nowS()>PET.holdUntil){say(pick(LG().EMOL.warmed));wasCold=0}if(S.tc.c>.4)wasCold=S.tc.c;
  if(S.tc.h<.2&&S.tc.c<.15&&nowS()>nextComfy&&PET.emo!=='sleep'&&!S.sleeping&&Math.random()<.3&&nowS()>PET.holdUntil){nextComfy=nowS()+240;say(pick(LG().EMOL.comfy))}}}

function tickCore(dt,nowMs,sim){const n=S.needs,c=clockAt(wsecAt(nowMs,S.birth));const asleep=S.sleeping;const L=S.log;
 const night=isNight(c.h);const nPets=S.pets.length,nPlay=Object.keys(S.play).length;
 const sm=sim?.3:1;n.food=clamp(n.food-(asleep?.018:.045)*sm*dt,0,100);
 n.energy=clamp(n.energy+(asleep?.03:-.016*(night?1.5:1))*dt,0,100);
 if(!asleep){n.fun=clamp(n.fun-.04*sm*(hasToy()?.5:1)*(nPlay?.7:1)*dt,0,100)}
 n.social=clamp(n.social-(asleep?.008:.025)*sm*(hasToy()?.6:1)*(nPets?.7:1)*dt,0,100);
 S.angerE=Math.max(0,S.angerE-.6*dt);if(sim){n.food=Math.max(n.food,14);n.fun=Math.max(n.fun,10);n.social=Math.max(n.social,8)}
 if(n.social<15&&!asleep&&!sim)S.bond=clamp(S.bond-.004*LOSSM[S.P.trait]*dt,0,100);
 if(n.food<8)mood(-.02*dt);
 thermo(dt,c,sim);
 if(!sim&&!asleep){
  if(PET.mode==='play'&&PET.play){const l=playLikeOf(PET.play.k);n.fun=clamp(n.fun+(l>0?2.4:l<0?.3:1.2)*dt,0,100);mood(l>0?.5*dt:l<0?-.05*dt:.16*dt);n.energy=clamp(n.energy-.05*dt,0,100);L.playt[PET.play.k]=(L.playt[PET.play.k]||0)+dt;n.social=clamp(n.social+.1*dt,0,100)}
  if(PET.mode==='petting'&&PET.petId){const p=petById(PET.petId);const l=p&&S.P.pk===p.type?1.7:1;n.social=clamp(n.social+2.2*dt*l,0,100);mood(.7*dt*l);n.fun=clamp(n.fun+.6*dt,0,100);if(p){L.pett[p.type]=(L.pett[p.type]||0)+dt;S.comfortUntil=nowS()+40;S.bond=clamp(S.bond+.01*dt,0,100)}}}
 if(sim){if(nPlay){n.fun=Math.max(n.fun,18)}if(nPets){mood(.003*dt);n.social=Math.max(n.social,14)}S.pets.forEach(p=>{p.hunger=Math.max(12,p.hunger-.004*dt)})}
 const aw=angerNow();
 const target=.3*n.food+.2*Math.min(100,n.energy+20)+.2*n.fun+.3*n.social-aw*.28-(ENV.dark&&!hasLamp()&&!asleep&&nowS()>S.comfortUntil?12:0)-(S.tc.c+S.tc.h)*22;
 n.mood=clamp(n.mood+(clamp(target,0,100)-n.mood)*Math.min(1,.015*dt),0,100);
 if(sim){if(!asleep&&night&&n.energy<80)S.sleeping=true;if(asleep&&((c.h>=6.5&&c.h<12&&n.energy>=80)||(n.energy>=100&&!night)))S.sleeping=false}
 L.n+=dt;L.sf+=n.food*dt;L.se+=n.energy*dt;L.sfun+=n.fun*dt;L.ss+=n.social*dt;L.sm+=n.mood*dt;L.sa+=S.bond*dt;L.sg=(L.sg||0)+aw*dt;L.scomf=(L.scomf||0)+(100-(S.tc.c+S.tc.h)*60)*dt;
 let e;if(sim){e=S.sleeping?'sleep':n.food<18?'hungry':S.tc.c>.45?'cold':S.tc.h>.45?'hot':n.energy<25?'sleepy':n.social<22?'lonely':n.mood<28?'sad':n.fun<22?'bored':n.mood>=72?'happy':'neutral'}else e=PET.emo;
 L.emo[e]=(L.emo[e]||0)+dt;if(S.sleeping)L.sleep+=dt;if(e==='fear')L.fear+=dt;if(wearAnger()>0)L.wear+=dt;
 const idx=logIdx(wsecAt(nowMs,S.birth));while(S.logDay<idx){finalizeDay(S.logDay,c);S.logDay++}
 const cm=c.month;while(S.repMonth<cm){makeReport(S.repMonth);S.repMonth++}}

 S.log.away=!S.log.touched;S.tc.c=0;S.tc.h=0}

const DIMS=['快乐','安全感','情绪稳定','陪伴感','自信','好感度','作息','成长','舒适','乐趣'];

function makeReport(m){const ds=S.days.filter(d=>Math.floor(d.d/30)===m);if(!ds.length)return;const N=ds.length;
 const avg=f=>ds.reduce((a,d)=>a+f(d),0)/N,sum=f=>ds.reduce((a,d)=>a+f(d),0);
 const totN=sum(d=>d.n)||1,slp=sum(d=>d.sleep),awk=Math.max(1,totN-slp);const es=ks=>sum(d=>ks.reduce((a,k)=>a+(d.emo[k]||0),0));
 const posShare=es(['happy','excited','love'])/awk,fearShare=es(['fear'])/awk,hungShare=es(['hungry'])/awk;
 const awayShare=sum(d=>d.away?1:0)/N,lesPer=sum(d=>d.les)/N,lesNoRate=sum(d=>d.lesNo)/Math.max(1,sum(d=>d.les));

 const D={};
 D['快乐']=clamp(.55*avg(d=>d.mood)+.45*(posShare*180),0,100);
 D['安全感']=clamp(100-clamp(fearShare*300,0,45)-clamp(sum(d=>d.thunder)*3,0,12)-hungShare*60+(hasLamp()?4:0)+(hasBed()?4:0),0,100);
 D['情绪稳定']=100-stress;
 D['陪伴感']=clamp(avg(d=>d.social)*.75+(1-awayShare)*25,0,100);
 D['自信']=clamp(52+sum(d=>d.praise)*3-sum(d=>d.scold)*6+lesPer*6+avg(d=>d.gain)*.6,0,100);
 D['好感度']=clamp(avg(d=>d.aff),0,100);
 D['作息']=clamp(100-Math.abs((sum(d=>d.ate+d.ref)/N)-3)*14-Math.abs(slp/totN-.33)*90-hungShare*40,0,100);
 D['成长']=clamp(lesPer*32+Object.values(S.stats).reduce((a,b)=>a+b,0)/5*.55,0,100);
 D['舒适']=clamp(avg(d=>d.comf==null?100:d.comf),0,100);

 DIMS.forEach(k=>D[k]=Math.round(D[k]));

/* ===== pointer: orbit / poke / pet / drag furniture & play items ===== */
function setupPointer(){
 let mode=null,sx,sy,drag=null,moved=0;const rc=new THREE.Raycaster(),pt=new THREE.Vector2();const plane=new THREE.Plane(new V3(0,1,0),0);

  if(curTab==='decor'){const objs=floorItems.filter(k=>DG[k]&&k!=='rug').map(k=>DG[k]);const h=rc.intersectObjects(objs,true)[0];if(h){const o=topOf(h.object);if(o){const pos=new V3();rc.ray.intersectPlane(plane,pos);drag={o,k:o.userData.slot,dx:o.position.x-pos.x,dz:o.position.z-pos.z,ox:o.position.x,oz:o.position.z,play:false};mode='drag';return}}}
  if(curTab==='play'){const objs=PLAY_KEYS.filter(k=>DGP[k]).map(k=>DGP[k]);const h=rc.intersectObjects(objs,true)[0];if(h){const o=topOf(h.object);if(o){const pos=new V3();rc.ray.intersectPlane(plane,pos);drag={o,k:o.userData.slot,dx:o.position.x-pos.x,dz:o.position.z-pos.z,ox:o.position.x,oz:o.position.z,play:true};playSel=drag.k;mode='drag';return}}}
  mode='orbit'});
 cv.addEventListener('pointermove',e=>{if(!mode)return;moved+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
  if(mode==='drag'){ndc(e);const pos=new V3();if(rc.ray.intersectPlane(plane,pos)){const nx=pos.x+drag.dx,nz=pos.z+drag.dz;
   if(drag.play){const p=Object.assign({},S.play[drag.k],{x:nx,z:nz});if(validPlay(drag.k,p,drag.k)){drag.o.position.x=nx;drag.o.position.z=nz;drag.o.position.y=.12}}
   else{const fp=fpRot(drag.o.userData.fp,itemRot(drag.k));const hw=fp[0]/2,hd=fp[1]/2;drag.o.position.x=clamp(nx,roomBounds.x[0]+hw,roomBounds.x[1]-hw);drag.o.position.z=clamp(nz,roomBounds.z[0]+hd,roomBounds.z[1]-hd);drag.o.position.y=.12;relampPos()}}}

 const up=e=>{if(mode==='drag'){drag.o.position.y=0;const k=drag.k;
   if(drag.play){S.play[k]=Object.assign({},S.play[k],{x:drag.o.position.x,z:drag.o.position.z})}

   PET.path=[];if(PET.mode==='walk')setMode('idle',.4);save()}
  else if(mode==='orbit'&&moved<6&&S&&PET.A){ndc(e);const h=rc.intersectObject(PET.A.root,true)[0];if(h)poke();else{const roots=S.pets.map(p=>CR[p.id]).filter(Boolean);for(const c of roots){if(rc.intersectObject(c.R.root,true)[0]){petTouch(c.p.id);break}}}}
  mode=null;drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function catchUp(){const now=Date.now();let el=(now-S.last)/1000;if(el<40)return 0;el=Math.min(el,86400*12);const dBefore=S.diary.length;
 simulateOffline(el,now-el*1000);

 const nd=S.diary.length-dBefore;if(nd>0){S.unreadD=(S.unreadD||0)+nd}
 const miss=el/8640;if(miss>=.25){aff(-Math.min(14,miss*3),'sim');mood(-Math.min(20,miss*6));S.needs.social=Math.min(S.needs.social,Math.max(5,80-miss*30))}
 save();return el}
